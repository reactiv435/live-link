<!doctype html>
<meta charset="utf-8">
<title>synthetic face</title>
<style>html, body { margin: 0; background: #20242a; } svg { display: block; }</style>
<!-- A DRAWN face (no photo, no real person): made for LIVE Link's CI so the tracking smoke has a face to find. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a4250"/><stop offset="1" stop-color="#1b1e24"/></linearGradient>
    <radialGradient id="skin" cx="0.46" cy="0.40" r="0.75"><stop offset="0" stop-color="#f1c7a5"/><stop offset="0.55" stop-color="#e2ad88"/><stop offset="1" stop-color="#b57f5e"/></radialGradient>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e58f7e" stop-opacity="0.55"/><stop offset="1" stop-color="#e58f7e" stop-opacity="0"/></radialGradient>
    <linearGradient id="noseShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a8704f" stop-opacity="0.55"/><stop offset="0.5" stop-color="#f6d2b4" stop-opacity="0.5"/><stop offset="1" stop-color="#a8704f" stop-opacity="0.35"/></linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2a1a10"/><stop offset="0.45" stop-color="#5a3a22"/><stop offset="1" stop-color="#2c1b10"/></radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1d15"/><stop offset="1" stop-color="#17100b"/></linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d4f6b"/><stop offset="1" stop-color="#27344a"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="eyeL"><path d="M548 318 Q578 296 612 318 Q580 336 548 318 Z"/></clipPath>
    <clipPath id="eyeR"><path d="M668 318 Q702 296 732 318 Q700 336 668 318 Z"/></clipPath>
  </defs>
  <rect width="1280" height="720" fill="url(#wall)"/>
  <!-- shoulders and neck -->
  <path d="M330 720 Q350 560 520 530 L760 530 Q930 560 950 720 Z" fill="url(#shirt)"/>
  <path d="M575 470 L575 560 Q640 600 705 560 L705 470 Z" fill="#cf9b78"/>
  <path d="M575 500 Q640 560 705 500 L705 470 L575 470 Z" fill="#9c6a4c" opacity="0.55" filter="url(#soft)"/>
  <!-- hair behind -->
  <path d="M468 330 Q450 120 640 110 Q830 120 812 330 Q820 420 790 470 L490 470 Q460 420 468 330 Z" fill="url(#hair)"/>
  <!-- ears -->
  <ellipse cx="496" cy="340" rx="20" ry="38" fill="#d9a380"/><ellipse cx="784" cy="340" rx="20" ry="38" fill="#d9a380"/>
  <!-- the face -->
  <path d="M500 300 Q498 170 640 164 Q782 170 780 300 Q782 400 730 462 Q690 506 640 508 Q590 506 550 462 Q498 400 500 300 Z" fill="url(#skin)"/>
  <!-- hairline -->
  <path d="M498 290 Q490 150 640 142 Q790 150 782 290 Q760 210 700 196 Q640 186 560 204 Q516 224 498 290 Z" fill="url(#hair)"/>
  <!-- soft shading: eye sockets, under the lip, jaw -->
  <ellipse cx="580" cy="312" rx="50" ry="26" fill="#9d6c52" opacity="0.30" filter="url(#softer)"/>
  <ellipse cx="700" cy="312" rx="50" ry="26" fill="#9d6c52" opacity="0.30" filter="url(#softer)"/>
  <ellipse cx="640" cy="458" rx="40" ry="10" fill="#93603f" opacity="0.35" filter="url(#soft)"/>
  <ellipse cx="560" cy="390" rx="46" ry="34" fill="url(#cheek)"/><ellipse cx="720" cy="390" rx="46" ry="34" fill="url(#cheek)"/>
  <!-- eyebrows -->
  <path d="M536 286 Q578 262 624 282 Q580 274 538 294 Z" fill="#2a1c14"/>
  <path d="M656 282 Q702 262 744 286 Q742 294 700 274 Q678 272 656 282 Z" fill="#2a1c14"/>
  <!-- eyes -->
  <path d="M548 318 Q578 296 612 318 Q580 336 548 318 Z" fill="#f4f1ec"/>
  <g clip-path="url(#eyeL)"><circle cx="581" cy="317" r="15" fill="url(#iris)"/><circle cx="581" cy="317" r="6.5" fill="#0b0705"/><circle cx="586" cy="312" r="3" fill="#fff"/></g>
  <path d="M546 318 Q578 292 614 318" fill="none" stroke="#231610" stroke-width="4" stroke-linecap="round"/>
  <path d="M552 322 Q580 338 608 322" fill="none" stroke="#7d5540" stroke-width="1.6" opacity="0.8"/>
  <path d="M668 318 Q702 296 732 318 Q700 336 668 318 Z" fill="#f4f1ec"/>
  <g clip-path="url(#eyeR)"><circle cx="699" cy="317" r="15" fill="url(#iris)"/><circle cx="699" cy="317" r="6.5" fill="#0b0705"/><circle cx="704" cy="312" r="3" fill="#fff"/></g>
  <path d="M666 318 Q702 292 734 318" fill="none" stroke="#231610" stroke-width="4" stroke-linecap="round"/>
  <path d="M672 322 Q700 338 728 322" fill="none" stroke="#7d5540" stroke-width="1.6" opacity="0.8"/>
  <!-- nose -->
  <path d="M628 310 Q620 372 606 396 Q640 418 674 396 Q660 372 652 310 Z" fill="url(#noseShade)" filter="url(#soft)"/>
  <path d="M612 398 Q626 410 640 406 Q654 410 668 398" fill="none" stroke="#7a4c36" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="622" cy="398" rx="7" ry="4" fill="#5c3626" opacity="0.8"/><ellipse cx="658" cy="398" rx="7" ry="4" fill="#5c3626" opacity="0.8"/>
  <ellipse cx="640" cy="372" rx="9" ry="16" fill="#fbe0c8" opacity="0.6" filter="url(#soft)"/>
  <!-- mouth -->
  <path d="M594 440 Q618 430 640 436 Q662 430 686 440 Q664 446 640 444 Q616 446 594 440 Z" fill="#b25a55"/>
  <path d="M594 440 Q640 468 686 440 Q664 446 640 444 Q616 446 594 440 Z" fill="#c8736c"/>
  <path d="M594 440 Q640 448 686 440" fill="none" stroke="#6d2f2d" stroke-width="2.2" stroke-linecap="round"/>
  <!-- light from the upper left -->
  <ellipse cx="590" cy="240" rx="70" ry="44" fill="#fff3e2" opacity="0.22" filter="url(#softer)"/>
</svg>
