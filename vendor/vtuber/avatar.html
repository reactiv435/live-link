<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- V9: a frame on this page (the live overlay) may only show https pages: never one of this PC's own http pages -->
<meta http-equiv="Content-Security-Policy" content="frame-src https:">
<title>Avatar (OBS Browser Source)</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #bg { position: fixed; inset: 0; display: none; }
  #bg.green { background: #00FF00; }
  #bg.black { background: #000000; }
  #bg.cover { background: #120b09; }
  #bg.preset { inset: -6%; background-color: #120b09; background-size: cover; background-position: center; filter: blur(7px) saturate(1.05) brightness(0.82); }
  #bg.preset::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, rgba(20, 10, 8, 0) 35%, rgba(20, 10, 8, 0.55) 100%); }
  /* V7: the old background on top of the new one for the half second of a shuffle change (js/v7-stage.js) */
  #bg2 { position: fixed; inset: 0; display: none; pointer-events: none; }
  #bg2.green { background: #00FF00; } #bg2.black { background: #000000; } #bg2.cover { background: #120b09; }
  #bg2.preset { inset: -6%; background-color: #120b09; background-size: cover; background-position: center; filter: blur(7px) saturate(1.05) brightness(0.82); }
  #bg2.preset::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, rgba(20, 10, 8, 0) 35%, rgba(20, 10, 8, 0.55) 100%); }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  /* the Mask (the third choice): its own opaque black canvas above the 3D one; viewer names above that, never mirrored */
  #maskc { position: fixed; inset: 0; width: 100%; height: 100%; display: none; background: #000; z-index: 2; }
  /* V8: the puppet show's 2D layer (bars, pictures, the vote): above the Mask, NEVER mirrored (its words must read right) */
  /* V9 CAMERA MODE: only the effects, on a see-through canvas over everything; his camera shows through this page */
  #maskcam { position: fixed; inset: 0; width: 100%; height: 100%; display: none; z-index: 4; pointer-events: none; }
  #maskhud { position: fixed; inset: 0; width: 100%; height: 100%; display: none; z-index: 3; pointer-events: none; }
  #maskNames { position: fixed; left: 0; right: 0; top: 7%; display: none; z-index: 3; text-align: center; pointer-events: none; font: 700 4.2vh/1.25 "Segoe UI", system-ui, sans-serif; letter-spacing: .02em; color: #fff6f0; }
  #maskNames div { margin: 0 6% .6vh; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-shadow: 0 0 1.2vh #e01f3d, 0 0 .4vh #000, 0 .2vh .5vh #000; opacity: 0; }
  #maskNames div.gift { color: #ffe9c4; text-shadow: 0 0 1.4vh #ff7a1a, 0 0 .4vh #000, 0 .2vh .5vh #000; }
</style>
</head>
