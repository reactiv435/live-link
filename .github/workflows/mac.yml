# Builds the Mac version of LIVE Link on GitHub's Mac machines and attaches it to a GitHub Release.
# Trigger: push a tag like v1.0.4 (a tag with a suffix, e.g. v1.0.4-ci1, makes a pre-release for testing),
# or run it by hand from the Actions tab (files are then kept as a build artifact, no release).
#
# No Apple Developer ID yet, so hosts click "Open Anyway" once in System Settings > Privacy & Security. The app is signed
# with ONE stable self-signed certificate (repo secrets MAC_CERT_P12 + MAC_CERT_PASSWORD, see docs/MAC_SIGNING.md): macOS
# Keychain then keeps trusting each new version, so the saved sign-in survives updates. Without those secrets the build
# uses a throwaway certificate (works, but the Keychain asks again after every update) and says so in a build warning.
name: Mac build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 40   # a hung step must not hold a runner for the default 6 hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"; TAG="${TAG%%-*}"
          VER="$(node -p 'require("./package.json").version')"
          echo "tag $TAG, package.json $VER"; test "$TAG" = "$VER"

      - run: npm ci

      - name: Tests
        run: node --test "test/*.test.js"

      - name: Source zip (AGPL; bundled into the app's Resources/source)
        run: node scripts/make-source.js

      - name: Package (universal = Intel + Apple Silicon, unsigned)
        run: npx electron-builder --mac --universal --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Signing identity (the stable certificate from the repo secrets, or a throwaway one)
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          if [ -n "$MAC_CERT_P12" ] && [ -n "$MAC_CERT_PASSWORD" ]; then
            printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            P12PASS="$MAC_CERT_PASSWORD"
            echo "::notice title=Signing::the stable LIVE Link certificate (Keychain access survives updates)"
          else
            P12PASS="$(openssl rand -hex 16)"
            printf '%s\n' '[req]' 'distinguished_name=dn' 'x509_extensions=ext' 'prompt=no' '[dn]' 'CN=LIVE Link throwaway build certificate' \
              '[ext]' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature' 'extendedKeyUsage=critical,codeSigning' > "$RUNNER_TEMP/req.cnf"
            /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 30 -config "$RUNNER_TEMP/req.cnf" -keyout "$RUNNER_TEMP/k.pem" -out "$RUNNER_TEMP/c.pem"
            /usr/bin/openssl pkcs12 -export -inkey "$RUNNER_TEMP/k.pem" -in "$RUNNER_TEMP/c.pem" -name "LIVE Link throwaway" -passout "pass:$P12PASS" -out "$RUNNER_TEMP/cert.p12"
            rm -f "$RUNNER_TEMP/k.pem"
            echo "::warning title=Signing::no MAC_CERT_P12 secret: signed with a throwaway certificate, so Mac hosts get a Keychain prompt after this update (see docs/MAC_SIGNING.md)"
          fi
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12PASS" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          HASH="$(security find-certificate -a -Z "$KC" | awk '/SHA-1 hash/{print $NF; exit}')"
          test -n "$HASH"
          echo "certificate SHA-1 $HASH"
          echo "SIGN_ID=$HASH" >> "$GITHUB_ENV"
          echo "SIGN_KC=$KC" >> "$GITHUB_ENV"

      - name: Sign and verify
        run: |
          APP="$(ls -d dist/mac-universal/*.app | head -1)"
          codesign --force --deep --sign "$SIGN_ID" --keychain "$SIGN_KC" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # The designated requirement is what the Keychain trusts: it must name the certificate, not this build's hash.
          DR="$(codesign -d -r- "$APP" 2>&1 | grep -E '^designated' || true)"
          echo "::notice title=Designated requirement::$DR"
          echo "$DR" | grep -q 'certificate'
          EXE="$(find "$APP/Contents/MacOS" -type f -perm +111 | head -1)"
          echo "Architectures: $(lipo -archs "$EXE")"
          lipo -archs "$EXE" | grep -q x86_64
          lipo -archs "$EXE" | grep -q arm64
          test -f "$APP/Contents/Resources/source/SOURCE.md" || ls "$APP/Contents/Resources/source"

      - name: Launch check (starts, logs its start line, no startup errors) on Apple Silicon and Intel
        run: |
          APP="$(ls -d dist/mac-universal/*.app | head -1)"
          EXE="$(find "$APP/Contents/MacOS" -type f -perm +111 | head -1)"
          VER="$(node -p 'require("./package.json").version')"
          # Publish the app's log as a build note: notes are public, the raw job log needs repo admin rights.
          note() { node -e 'const fs=require("fs");let t="(no log file)";try{t=fs.readFileSync(process.argv[2],"utf8").split("\n").slice(-40).join("\n")}catch{};console.log("::"+process.argv[3]+" title=LIVE Link log ("+process.argv[1]+")::"+t.replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A"))' "$1" "$2" "$3"; }
          FAIL=0
          for MODE in native x86_64; do
            PROFILE="$RUNNER_TEMP/livelink-$MODE"
            if [ "$MODE" = x86_64 ]; then arch -x86_64 "$EXE" --hidden --user-data-dir="$PROFILE" & else "$EXE" --hidden --user-data-dir="$PROFILE" & fi
            PID=$!
            # Wait for the start line (Rosetta translates the whole app on its first x86_64 launch, which is slow),
            # then make sure it is still running a few seconds later.
            LOG=""; STARTED=0
            for t in $(seq 1 60); do
              for f in "$PROFILE/logs/live-link.log" "$HOME/Library/Application Support/ReactivVibe LIVE Link/logs/live-link.log"; do
                if [ -z "$LOG" ] && [ -f "$f" ]; then LOG="$f"; fi
              done
              if [ -n "$LOG" ] && grep -q "LIVE Link $VER starting" "$LOG"; then STARTED=1; break; fi
              kill -0 "$PID" 2>/dev/null || break
              sleep 2
            done
            echo "$MODE: start line after about $((t * 2)) s (started=$STARTED)"
            sleep 8
            # A quit (SIGTERM = app.quit) must finish by itself within 20 s; never wait on it forever.
            ALIVE=0; QUIT=1
            if kill -0 "$PID" 2>/dev/null; then
              ALIVE=1; kill "$PID"
              for q in $(seq 1 20); do kill -0 "$PID" 2>/dev/null || break; sleep 1; done
              if kill -0 "$PID" 2>/dev/null; then QUIT=0; kill -9 "$PID" 2>/dev/null || true; fi
              wait "$PID" 2>/dev/null || true
            fi
            OK=1
            [ "$ALIVE" = 1 ] || { echo "::error title=Launch ($MODE)::LIVE Link exited early"; OK=0; }
            [ "$QUIT" = 1 ] || { echo "::error title=Quit ($MODE)::LIVE Link did not exit within 20 s of a quit (SIGTERM)"; OK=0; }
            if [ -n "$LOG" ] && grep -q "LIVE Link $VER starting" "$LOG"; then :; else echo "::error title=Launch ($MODE)::no 'LIVE Link $VER starting' line in the log"; OK=0; fi
            if [ -n "$LOG" ] && grep -Eq "uncaught|unhandled| ERROR " "$LOG"; then echo "::error title=Launch ($MODE)::startup errors in the log"; OK=0; fi
            if [ "$OK" = 1 ]; then note "$MODE" "$LOG" notice; else note "$MODE" "$LOG" error; FAIL=1; fi
          done
          exit $FAIL

      - name: dmg, zip and latest-mac.json
        run: node scripts/release-mac.js

      - name: Sizes (the live-link bucket must allow them)
        run: ls -l dist-mac/

      - name: Check the zipped and the dmg'd app are still signed
        run: |
          mkdir -p "$RUNNER_TEMP/unzip" && ditto -x -k dist-mac/LIVE-Link-*-mac.zip "$RUNNER_TEMP/unzip"
          codesign --verify --deep --strict "$(ls -d "$RUNNER_TEMP"/unzip/*.app | head -1)"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist-mac/LIVE-Link-*-mac.dmg
          codesign --verify --deep --strict "$(ls -d "$RUNNER_TEMP"/dmg/*.app | head -1)"
          hdiutil detach "$RUNNER_TEMP/dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: live-link-mac
          path: dist-mac/

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist-mac/LIVE-Link-*-mac.dmg
            dist-mac/LIVE-Link-*-mac.zip
            dist-mac/latest-mac.json
            dist-mac/SHA256SUMS.txt
